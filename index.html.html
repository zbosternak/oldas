<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnaLog önoldás</title>
<style>
:root{--bg:#eef0f6;--card:#fff;--ink:#1f2540;--mute:#6a7090;--line:#d6d9e6;--ac:#4f52c9;--acs:#e3e4fa;--gold:#c8870a;--golds:#fbefd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172b;--card:#1d2140;--ink:#e8eaf8;--mute:#9aa0c4;--line:#323760;--ac:#8d90f0;--acs:#2a2e5e;--gold:#f0b94a;--golds:#3b3118}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100%;padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:600 22px/1.25 Georgia,"Times New Roman",serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.prog{display:flex;gap:5px;margin:6px 0 10px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--ac)}.prog i.n{background:var(--ac);opacity:.55}
.prog.w i.d,.prog.w i.n{background:var(--gold)}
.badge{display:inline-block;background:var(--acs);color:var(--ac);border-radius:99px;padding:2px 11px;font-size:13px;font-weight:600}
.w .badge,.badge.g{background:var(--golds);color:var(--gold)}
.f{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.f label{display:block;font-weight:600;margin-bottom:2px}
.f small{display:block;color:var(--mute);margin-bottom:8px}
textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:76px;resize:vertical}
textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 9px}
.chip{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.w .chip.on{background:var(--gold);border-color:var(--gold);color:#1a1405}
.seed,.recap,.note{border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.seed{background:var(--acs)}.recap{background:var(--card);border:1px dashed var(--line);color:var(--mute)}
.note{background:var(--golds);color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:600;border-radius:12px;padding:13px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;flex:1}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;flex:2}
.btn.g{background:var(--gold);border-color:var(--gold);color:#1a1405;flex:2}
.btn.s{flex:0 0 auto;padding:13px 18px}
.col{flex-direction:column}
pre{white-space:pre-wrap;word-break:break-word;font:14px/1.55 inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
</style>
</head>
<body>
<main id="m"></main>
<div class="nav"><div id="n"></div></div>
<script>
var KEY='analog-onoldas-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fresh(){return {topic:'',imgs:[{}],ci:0,ph:'topic',wand:{},chk:{},ck:0}}
var S=load()||fresh();if(S.wi==null)S.wi=S.imgs.length-1;
var ERZ=['Félelem','Düh','Szomorúság','Szégyen','Tehetetlenség','Magány','Bűntudat','Feszültség','Zavar','Fájdalom'];
var REA=['Lefagytam','Elmenekültem','Visszavágtam','Elnyomtam','Alkalmazkodtam','Sírtam','Kiabáltam','Hallgattam'];
var P={
topic:{s:1,t:'Min szeretnél dolgozni?',i:[{k:'topic',l:'Mi a problémád?',h:'Egy-két mondat elég.'}]},
kep:{s:2,t:'Belső kép',i:[{k:'kep',l:'Mit látsz belül, mi a történet?',h:'Az első kép, ami megjelenik, és ami benne történik.'},{k:'anal',n:1,l:'Analógiás pont: hol kapcsol be az az érzés, amivel ide léptünk?',h:'Hol van a történetben az a pont, ahol megjelenik az előző kép érzése?'},{k:'erz',l:'Mit érzel?',c:ERZ}]},
jo:{s:3,t:'Visszatekerés',i:[{k:'jo',l:'Hol volt még jó neked?',h:'Tekerd vissza a képet. Mi volt akkor körülötted, mit éreztél?'}]},
rossz:{s:4,t:'Az első rossz érzés',i:[{k:'rossz',l:'Hol jött az első rossz érzés, és mi volt az?'},{k:'vart',l:'Váratlan volt?',c:['Igen','Nem'],one:1},{k:'zavar',l:'Mi zavar benne?'},{k:'reak',l:'Hogyan reagáltál?',c:REA}]},
csere:{s:5,t:'Csere',i:[{k:'mit',l:'Mit tett volna valaki más a helyedben, hogy jól érezze magát?',h:'Valaki, aki nem te. Lehet valós személy, mesehős, bárki.'}]},
vissza:{s:6,t:'Visszacserélés',i:[{k:'gatlo',l:'Cseréld vissza magad. Melyik rossz érzés gátol most?'}]},
wand:{s:7,t:'Varázspálca',w:1,i:[{k:'j',l:'Mit javítasz ki? Csak EGY dolgot.',h:'Pl. az anyukád nem kiabál rád.'}]},
after:{s:7,t:'A javítás után',w:1,i:[{k:'st',l:'Hogy érzed magad a javítás után?',c:['Jó lett','Jobb lett','Semleges','Még rossz'],one:1},{k:'nt',l:'Milyen érzés ez most?',h:'Ha rossz maradt, ezzel megyünk tovább.'}]},
check:{s:7,t:'Ellenőrzés visszafelé',w:1,i:[{k:'st',l:'Hogy érzed most ezt a képet?',c:['Megváltozott','Jobb lett','Semleges','Még rossz'],one:1},{k:'nt',l:'Megjegyzés'}]}
};
var ORD=['topic','kep','jo','rossz','csere','vissza'];
function tg(){var p=S.ph;if(p=='topic')return S;if(p=='wand')return S.wand;if(p=='after')return S.after=S.after||{};if(p=='check'){return S.chk[S.ck]=S.chk[S.ck]||{}}return S.imgs[S.ci]}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function U(k,v){tg()[k]=v;save()}
function C(k,o,one){var t=tg(),a=(t[k]||'').split(', ').filter(Boolean),i=a.indexOf(o);if(one){a=i>-1?[]:[o]}else{if(i>-1)a.splice(i,1);else a.push(o)}t[k]=a.join(', ');save();draw()}
function F(k,v){var t=tg();t[k]=v;save();draw()}
function field(it){
 var t=tg(),v=t[it.k]||'',h='<div class="f"><label>'+it.l+'</label>'+(it.h?'<small>'+it.h+'</small>':'');
 if(it.c){h+='<div class="chips">'+it.c.map(function(o){return '<button class="chip'+((v.split(', ').indexOf(o)>-1)?' on':'')+'" onclick="C(\''+it.k+'\',\''+o+'\','+(it.one?1:0)+')">'+o+'</button>'}).join('')+'</div>'}
 if(!(it.one&&it.k=='vart'))h+='<textarea oninput="U(\''+it.k+'\',this.value)" rows="3">'+esc(v)+'</textarea>';
 return h+'</div>'}
function sum(){
 var o=[];if(S.topic)o.push('Téma: '+S.topic);
 S.imgs.forEach(function(g,i){var n=i+1,r=[];
  if(g.kep)r.push('Kép és történet: '+g.kep);if(g.tort)r.push('Történet: '+g.tort);if(g.anal)r.push('Analógiás pont: '+g.anal);if(g.erz)r.push('Érzések: '+g.erz);
  if(g.jo)r.push('Hol volt jó: '+g.jo);
  if(g.rossz)r.push('Első rossz érzés: '+g.rossz+(g.vart?' (váratlan: '+g.vart+')':''));
  if(g.zavar)r.push('Zavar: '+g.zavar);if(g.reak)r.push('Reakció: '+g.reak);
  if(g.mit)r.push('Csere: '+g.mit);
  if(g.gatlo)r.push('Gátló érzés: '+g.gatlo);
  if(r.length)o.push('\n'+n+'. kép\n'+r.join('\n'))});
 (S.log||[]).forEach(function(l){o.push('\nVarázspálca (korábbi)\nJavítás: '+l.j+(l.st?'\nJavítás után: '+l.st+(l.nt?' – '+l.nt:''):''))});
 if(S.wand.j)o.push('\nVarázspálca\nJavítás: '+S.wand.j+(S.after&&S.after.st?'\nJavítás után: '+S.after.st+(S.after.nt?' – '+S.after.nt:''):''));
 var ck=[];Object.keys(S.chk).sort(function(a,b){return b-a}).forEach(function(i){var c=S.chk[i];if(c.st||c.nt)ck.push((+i+1)+'. kép: '+(c.st||'')+(c.nt?' – '+c.nt:''))});
 if(ck.length)o.push('\nEllenőrzés\n'+ck.join('\n'));
 return o.join('\n')}
function draw(){
 var p=S.ph,m=document.getElementById('m'),n=document.getElementById('n'),g=S.imgs[S.ci],h='';
 if(p=='sum'){
  m.innerHTML='<h1>Kész az oldás</h1><p class="sub">Itt az egész folyamat. Másold ki, vagy kezdj újat.</p><pre>'+esc(sum())+'</pre>';
  n.innerHTML='<div class="col" style="display:flex;gap:8px;flex:1"><button class="btn p" id="pd" onclick="pdf()">PDF mentése</button><div style="display:flex;gap:8px"><button class="btn s" onclick="back()">Vissza</button><button class="btn" onclick="rst()">Új oldás</button><button class="btn" id="cp" onclick="cpy()">Másolás</button></div></div>';return}
 var d=P[p],w=d.w?' w':'';
 h+='<div class="prog'+w+'">';for(var i=1;i<=7;i++)h+='<i class="'+(i<d.s?'d':i==d.s?'n':'')+'"></i>';h+='</div>';
 var img=(p=='kep'||p=='jo'||p=='rossz'||p=='csere'||p=='vissza');
 h+='<span class="badge">'+d.s+'. lépés'+(img?' · '+(S.ci+1)+'. kép':'')+'</span><h1>'+d.t+'</h1>';
 if(p=='kep'&&S.ci>0){var pg=S.imgs[S.ci-1];h+='<div class="seed">Ebből az érzésből indulsz: <b>'+esc(pg.gatlo||pg.rossz||'')+'</b></div>'}
 if(p!='topic'&&p!='wand'&&S.topic)h+='<p class="sub">Téma: '+esc(S.topic)+'</p>';
 if(p=='check'){var c=S.imgs[S.ck];h+='<div class="recap"><b>'+(S.ck+1)+'. kép:</b> '+esc(c.kep||'(nincs leírás)')+(c.rossz?'<br>Első rossz érzés: '+esc(c.rossz):'')+'</div>'+(S.wand.j?'<div class="seed">Varázspálca: '+esc(S.wand.j)+'</div>':'')}
 if(p=='after')h+='<div class="seed">Varázspálca: '+esc(S.wand.j||'')+'</div>';
 if(p=='wand')h+='<div class="note">Menj a legmélyebb, váratlan helyzethez. Egy javítás megváltoztatja a többi képet is.</div>';
 d.i.forEach(function(it){if(it.n&&S.ci==0)return;h+=field(it)});
 if(p=='rossz'&&(g.vart||'')=='Igen')h+='<div class="note">Váratlan élmény. Ha ez a mélypont, jöhet a varázspálca.<button class="btn g" style="margin-top:8px;width:100%" onclick="toWand()">Varázspálca ezen a képen</button></div>';
 if(p=='vissza'){
  h+='<button class="btn" style="width:100%" onclick="same()">Nincs más gátló – az első rossz érzéssel megyek tovább</button>';
  var u=S.imgs.some(function(x){return x.vart=='Igen'});
  h+='<p class="sub" style="margin-top:12px">'+(S.ci+1)+'. kép kész. A folyamat általában 3–8 kép.'+(u?' Váratlan élmény már volt, ha ez az alap, jöhet a pálca.':'')+'</p>'}
 m.innerHTML=h;
 if(p=='vissza')n.innerHTML='<div class="col" style="display:flex;gap:8px;flex:1"><button class="btn p" onclick="nextImg()">Következő kép ebből az érzésből</button><div style="display:flex;gap:8px"><button class="btn s" onclick="back()">Vissza</button><button class="btn g" style="flex:1" onclick="toWand()">Mélypont: varázspálca</button></div></div>';
 else if(p=='wand')n.innerHTML='<button class="btn s" onclick="back()">Vissza</button><button class="btn g" onclick="next()">Tovább</button>';
 else if(p=='after'){var bd=(S.after||{}).st=='Még rossz';n.innerHTML='<button class="btn s" onclick="back()">Vissza</button>'+(bd?'<button class="btn p" onclick="goOn()">Ezzel megyek tovább</button>':'<button class="btn g" onclick="next()">'+(S.wi<1?'Összegzés':'Ellenőrzés indul')+'</button>')}
 else if(p=='check'){var bc=(S.chk[S.ck]||{}).st=='Még rossz';n.innerHTML='<button class="btn s" onclick="back()">Vissza</button>'+(bc?'<button class="btn p" onclick="goOn()">Ezzel megyek tovább</button>':'<button class="btn g" onclick="next()">'+(S.ck>0?'Előző kép':'Összegzés')+'</button>')}
 else n.innerHTML=(p=='topic'?'':'<button class="btn s" onclick="back()">Vissza</button>')+(img?'<button class="btn g s" onclick="toWand()">🪄 Pálca</button>':'')+'<button class="btn p" onclick="next()">Tovább</button>';
 window.scrollTo(0,0)}
function next(){var p=S.ph;
 if(p=='topic'&&!S.topic.trim()){alert('Írd le röviden, min szeretnél dolgozni.');return}
 if(p=='check'){if(S.ck>0)S.ck--;else S.ph='sum'}
 else if(p=='wand')S.ph='after';
 else if(p=='after'){if(S.wi<1)S.ph='sum';else{S.ck=S.wi-1;S.ph='check'}}
 else S.ph=ORD[ORD.indexOf(p)+1];
 save();draw()}
function back(){var p=S.ph;
 if(p=='sum'){if(S.wi<1)S.ph='after';else{S.ph='check';S.ck=0}}
 else if(p=='check'){if(S.ck<S.wi-1)S.ck++;else S.ph='after'}
 else if(p=='wand')S.ph='vissza';else if(p=='after')S.ph='wand';
 else if(p=='kep'){if(S.ci>0){S.ci--;S.ph='vissza'}else S.ph='topic'}
 else S.ph=ORD[ORD.indexOf(p)-1];
 save();draw()}
function same(){var g=S.imgs[S.ci];g.gatlo=g.rossz||'';save();draw()}
function nextImg(){if(S.imgs.length>=8&&!confirm('Már 8 képnél tartasz. Biztos folytatod?'))return;if(!S.imgs[S.ci].gatlo)S.imgs[S.ci].gatlo=S.imgs[S.ci].rossz||'';S.imgs.push({});S.ci=S.imgs.length-1;S.ph='kep';save();draw()}
function toWand(){S.wi=S.ci;S.ph='wand';save();draw()}
var D=null;try{claude.use('downloads').then(function(q){D=q},function(){})}catch(e){}
async function pdf(){
 var D=null;try{D=await claude.use('downloads')}catch(e){}
 
 var W=1190,H=1684,M=110,cv,x,y,pages=[],SANS='-apple-system,"Segoe UI",Roboto,Arial,sans-serif',SER='Georgia,"Times New Roman",serif';
 function np(){if(cv)pages.push(cv);cv=document.createElement('canvas');cv.width=W;cv.height=H;x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='alphabetic';y=M}
 function T(s,f,c,lh){x.font=f;var ln='',out=[];s.split(' ').forEach(function(w){var t=ln?ln+' '+w:w;if(x.measureText(t).width>W-2*M&&ln){out.push(ln);ln=w}else ln=t});if(ln)out.push(ln);out.forEach(function(l){if(y+lh>H-M)np();x.font=f;x.fillStyle=c;x.fillText(l,M,y+lh*0.75);y+=lh})}
 np();T('AnaLog önoldás','600 54px '+SER,'#1f2540',66);T(new Date().toLocaleDateString('hu-HU'),'24px '+SANS,'#6a7090',36);y+=20;
 sum().split('\n').forEach(function(l){
  if(!l.trim()){y+=14;return}
  if(/^\d+\. kép$/.test(l)||l.indexOf('Varázspálca')==0||l=='Ellenőrzés'){y+=18;T(l,'600 38px '+SER,'#4f52c9',50);return}
  var i=l.indexOf(': ');
  if(i>0&&i<40){T(l.slice(0,i),'600 24px '+SANS,'#6a7090',34);T(l.slice(i+2),'27px '+SANS,'#1f2540',40);y+=6}
  else T(l,'27px '+SANS,'#1f2540',40)});
 pages.push(cv);
 var enc=new TextEncoder(),parts=[],off=[],len=0,n=pages.length,N=3+3*n,kids=[],i;
 function add(z){var q=typeof z=='string'?enc.encode(z):z;parts.push(q);len+=q.length}
 add('%PDF-1.4\n');
 off[1]=len;add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 for(i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
 off[2]=len;add('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
 pages.forEach(function(c,i){
  var u=atob(c.toDataURL('image/jpeg',0.92).split(',')[1]),j=new Uint8Array(u.length),k,p=3+3*i,ct='q 595 0 0 842 0 0 cm /Im0 Do Q';
  for(k=0;k<u.length;k++)j[k]=u.charCodeAt(k);
  off[p]=len;add(p+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+(p+2)+' 0 R >> >> /Contents '+(p+1)+' 0 R >>\nendobj\n');
  off[p+1]=len;add((p+1)+' 0 obj\n<< /Length '+ct.length+' >>\nstream\n'+ct+'\nendstream\nendobj\n');
  off[p+2]=len;add((p+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n');add(j);add('\nendstream\nendobj\n')});
 var xo=len,xr='xref\n0 '+N+'\n0000000000 65535 f \n';
 for(i=1;i<N;i++)xr+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 add(xr+'trailer\n<< /Size '+N+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
 var fn='analog-onoldas-'+new Date().toISOString().slice(0,10)+'.pdf',bl=new Blob(parts,{type:'application/pdf'});
 if(D){D.save({filename:fn,data:bl}).catch(function(e){if(!e||e.code!='declined')alert('A PDF mentése nem sikerült'+(e&&e.code?' ('+e.code+')':'')+'.')})}
 else{var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a)},1500)}}
function goOn(){var a=S.ph=='after'?S.after:S.chk[S.ck],t=(a&&a.nt)||'megmaradt rossz érzés',g=S.imgs[S.wi];
 S.log=S.log||[];S.log.push({j:S.wand.j||'',st:(S.after||{}).st||'',nt:(S.after||{}).nt||''});
 g.gatlo=t;S.imgs.splice(S.wi+1,0,{});S.ci=S.wi+1;S.ph='kep';S.wand={};S.after={};S.chk={};S.ck=0;save();draw()}
function rst(){if(confirm('Törlöd az eddigi munkát, és újat kezdesz?')){S=fresh();save();draw()}}
function cpy(){var t=sum(),b=document.getElementById('cp');
 function ok(){b.textContent='Másolva'}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else fb();
 function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(a)}}
draw();
</script>
</body>
</html>
